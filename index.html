<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<title>Calculator</title>
<style>
  :root {
    --bg: #1a1a2e;
    --card: #24243e;
    --accent: #d97757;
    --accent-press: #b85f42;
    --key: #34345a;
    --key-press: #44447a;
    --fn: #4a4a72;
    --text: #eaeaf2;
    --muted: #9a9ab0;
    --border: #34345a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .calc {
    width: 100%;
    max-width: 360px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
  }
  .display {
    background: var(--bg);
    border-radius: 14px;
    padding: 18px 16px;
    margin-bottom: 16px;
    text-align: right;
    overflow: hidden;
  }
  .expression {
    min-height: 1.2em;
    color: var(--muted);
    font-size: 0.95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .result {
    font-size: 2.4rem;
    font-weight: 600;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    border: none;
    border-radius: 12px;
    background: var(--key);
    color: var(--text);
    font-size: 1.3rem;
    font-weight: 500;
    padding: 18px 0;
    cursor: pointer;
    transition: background 0.1s, transform 0.05s;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { background: var(--key-press); transform: scale(0.96); }
  button.fn { background: var(--fn); font-size: 1.15rem; }
  button.fn:active { background: var(--key-press); }
  button.op { background: var(--accent); }
  button.op:active { background: var(--accent-press); }
  button.zero { grid-column: span 2; }
  footer {
    margin-top: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
  }
</style>
</head>
<body>
<div class="calc">
  <div class="display">
    <div class="expression" id="expression">&nbsp;</div>
    <div class="result" id="result">0</div>
  </div>
  <div class="keys">
    <button class="fn" data-action="clear">AC</button>
    <button class="fn" data-action="negate">±</button>
    <button class="fn" data-action="percent">%</button>
    <button class="op" data-op="÷">÷</button>

    <button data-digit="7">7</button>
    <button data-digit="8">8</button>
    <button data-digit="9">9</button>
    <button class="op" data-op="×">×</button>

    <button data-digit="4">4</button>
    <button data-digit="5">5</button>
    <button data-digit="6">6</button>
    <button class="op" data-op="−">−</button>

    <button data-digit="1">1</button>
    <button data-digit="2">2</button>
    <button data-digit="3">3</button>
    <button class="op" data-op="+">+</button>

    <button class="zero" data-digit="0">0</button>
    <button data-action="decimal">.</button>
    <button class="op" data-action="equals">=</button>
  </div>
  <footer>Keyboard works too: digits, + − * /, Enter, Esc, Backspace</footer>
</div>

<script>
  const exprEl = document.getElementById("expression");
  const resultEl = document.getElementById("result");

  let current = "0";      // number being typed
  let previous = null;    // stored operand
  let operator = null;    // pending operator
  let justEvaluated = false;

  function compute(a, op, b) {
    a = parseFloat(a); b = parseFloat(b);
    let r;
    switch (op) {
      case "+": r = a + b; break;
      case "−": r = a - b; break;
      case "×": r = a * b; break;
      case "÷":
        if (b === 0) return "Error";
        r = a / b; break;
    }
    // trim float artifacts like 0.30000000000000004
    return String(parseFloat(r.toPrecision(12)));
  }

  function render() {
    resultEl.textContent = current;
    exprEl.innerHTML = (previous !== null && operator)
      ? previous + " " + operator
      : "&nbsp;";
  }

  function inputDigit(d) {
    if (current === "Error" || justEvaluated) {
      if (justEvaluated) { previous = null; operator = null; }
      current = d;
      justEvaluated = false;
    } else if (current === "0") {
      current = d;
    } else if (current.length < 15) {
      current += d;
    }
    render();
  }

  function inputDecimal() {
    if (current === "Error" || justEvaluated) {
      if (justEvaluated) { previous = null; operator = null; }
      current = "0.";
      justEvaluated = false;
    } else if (!current.includes(".")) {
      current += ".";
    }
    render();
  }

  function setOperator(op) {
    if (current === "Error") return;
    if (previous !== null && operator && !justEvaluated) {
      previous = compute(previous, operator, current);
      if (previous === "Error") { current = "Error"; previous = null; operator = null; render(); return; }
      current = previous;
    } else {
      previous = current;
    }
    operator = op;
    justEvaluated = false;
    current = previous;
    render();
    // start fresh number on next digit
    current = "0";
    resultEl.textContent = previous;
  }

  function equals() {
    if (previous === null || !operator || current === "Error") return;
    const result = compute(previous, operator, current);
    exprEl.textContent = previous + " " + operator + " " + current + " =";
    current = result;
    previous = null;
    operator = null;
    justEvaluated = true;
    resultEl.textContent = current;
  }

  function clearAll() {
    current = "0";
    previous = null;
    operator = null;
    justEvaluated = false;
    render();
  }

  function negate() {
    if (current === "Error" || current === "0") return;
    current = current.startsWith("-") ? current.slice(1) : "-" + current;
    render();
  }

  function percent() {
    if (current === "Error") return;
    current = String(parseFloat((parseFloat(current) / 100).toPrecision(12)));
    render();
  }

  function backspace() {
    if (current === "Error" || justEvaluated) return;
    current = current.length > 1 ? current.slice(0, -1) : "0";
    if (current === "-") current = "0";
    render();
  }

  document.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.dataset.digit !== undefined) inputDigit(btn.dataset.digit);
      else if (btn.dataset.op) setOperator(btn.dataset.op);
      else if (btn.dataset.action === "decimal") inputDecimal();
      else if (btn.dataset.action === "equals") equals();
      else if (btn.dataset.action === "clear") clearAll();
      else if (btn.dataset.action === "negate") negate();
      else if (btn.dataset.action === "percent") percent();
    });
  });

  const keyOps = { "+": "+", "-": "−", "*": "×", "/": "÷" };
  document.addEventListener("keydown", e => {
    if (e.key >= "0" && e.key <= "9") inputDigit(e.key);
    else if (keyOps[e.key]) { e.preventDefault(); setOperator(keyOps[e.key]); }
    else if (e.key === ".") inputDecimal();
    else if (e.key === "Enter" || e.key === "=") { e.preventDefault(); equals(); }
    else if (e.key === "Escape") clearAll();
    else if (e.key === "Backspace") backspace();
    else if (e.key === "%") percent();
  });

  render();
</script>
</body>
</html>
